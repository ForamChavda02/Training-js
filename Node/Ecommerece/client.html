<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <h2>socket.io Demo</h2>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

            console.log(msg);
        });
